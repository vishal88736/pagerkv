[project]
name = "pagerkv"
version = "1.1.0"
description = "REST replicated key-value store with bounded agent context and visual node replication"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines: formatting is not enforced
    "B008",  # FastAPI Query()/Depends() defaults are idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["common", "node_a", "node_b", "bench"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
