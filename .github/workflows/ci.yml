name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Benchmark (fails if over budget, lossy, or recall regresses)
        shell: bash  # -eo pipefail, so the tee does not hide a failure
        run: python bench/run_benchmark.py --check | tee bench-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            bench/results.csv
            bench-summary.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pagerkv .
