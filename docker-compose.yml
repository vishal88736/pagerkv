# docker compose up --build   ->  dashboard at http://127.0.0.1:8001/ui
#
# Ports are published on 127.0.0.1 only. Inside Docker, browser requests do not
# come from loopback, so the dashboard's Node B fault switch needs a token:
#   PAGERKV_ADMIN_TOKEN=some-long-secret docker compose up --build
# and enter the same token when the dashboard asks for it.
services:
  node-b:
    build: .
    command: ["uvicorn", "node_b.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      NODE_B_DB: /data/kv_node_b.db
      PAGERKV_ADMIN_TOKEN: ${PAGERKV_ADMIN_TOKEN:-}
    volumes:
      - node_b_data:/data
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  node-a:
    build: .
    command: ["uvicorn", "node_a.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      NODE_B_URL: http://node-b:8002
      NODE_A_DB: /data/kv_node_a.db
      PAGERKV_ADMIN_TOKEN: ${PAGERKV_ADMIN_TOKEN:-}
    volumes:
      - node_a_data:/data
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      node-b:
        condition: service_healthy

volumes:
  node_a_data:
  node_b_data:
